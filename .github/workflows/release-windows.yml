name: Build and publish Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name GeminiDesktopOperator --collect-all google.genai --collect-all keyring src/main.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        run: |
          mkdir release
          iscc installer/GeminiDesktopOperator.iss

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Desktop-Operator-Windows-Installer
          path: release/Gemini_Desktop_Operator_Setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/Gemini_Desktop_Operator_Setup.exe
