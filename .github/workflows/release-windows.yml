
name: Build and publish Highlander Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Highlander executable
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name Highlander --collect-all google.genai --collect-all keyring src/main.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Highlander installer
        run: |
          New-Item -ItemType Directory -Force -Path release
          iscc installer/Highlander.iss
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Highlander-Windows-Installer
          path: release/Highlander_Setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/Highlander_Setup.exe
